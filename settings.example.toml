# Lokale instellingen op de Raspberry Pi (niet in Dropbox!).
# Alles heeft een standaardwaarde; dit bestand is dus optioneel.
# Dropbox koppelen en de presentatie kiezen doe je op de instelpagina:
# http://<ip-adres-van-de-pi>:8080 (het adres staat op het scherm).

[dropbox]
# Hierin staan de presentaties; elke submap is een presentatie.
base_folder = "/Mediakranten/Present-it"
# App key van de Dropbox-app; standaard die van BMSignage (q34alcs3we24vx7).
# app_key = ""

[web]
port = 8080

[paths]
# Lokale kopie van de gekozen map; hieruit wordt afgespeeld (werkt dus ook offline).
cache_dir = "~/.cache/monsterscreen"
# Koppeling en gekozen presentatie, bijgehouden door de instelpagina.
state_file = "~/.config/monsterscreen/state.json"

[player]
# Werkt op Raspberry Pi OS Lite (zonder desktop). Met desktop: ["--hwdec=auto-safe"]
mpv_args = ["--vo=gpu", "--gpu-context=drm", "--hwdec=v4l2m2m", "--profile=fast"]

[power]
# Hoe het scherm uit gaat buiten de tijden in [schedule] van config.toml:
#   "black"    alleen zwart beeld (werkt altijd)
#   "cec"      TV in stand-by via HDMI-CEC (sudo apt install v4l-utils)
#   "vcgencmd" HDMI-signaal uit, monitor gaat slapen (alleen met fkms/legacy driver)
#   "command"  eigen commando's hieronder
method = "black"
on_command = ""
off_command = ""
